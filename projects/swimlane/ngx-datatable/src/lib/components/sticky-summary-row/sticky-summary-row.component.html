<div [style.width.px]="_columnGroupWidths.total" class="datatable-sticky-summary-row-inner">
  @for (colGroup of _columnsByPin; track trackByGroups($index, colGroup)) {
    <div
      [class]="'datatable-row-' + colGroup.type"
      [ngStyle]="_styleByGroup[colGroup.type]"
      >
      @for (column of colGroup.columns; track columnTrackingFn($index, column)) {
        <datatable-body-cell
          [row]="row"
          [column]="column"
          >
        </datatable-body-cell>
      }
    </div>
  }
</div>
